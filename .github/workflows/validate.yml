name: Validate WaveForge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete test suite
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Build example
        run: python scripts/build_plan_workspace.py --source examples/source-plan.md --manifest examples/decomposition.yaml --split-config examples/splitting.yaml --out .demo-workspace
      - name: Validate example
        run: python scripts/validate_plan_workspace.py .demo-workspace
      - name: Build real-project case study
        run: python scripts/build_plan_workspace.py --source examples/real-project/source-plan.md --manifest examples/real-project/decomposition.yaml --out .demo-workspace-real-project
      - name: Validate rebuilt case study
        run: python scripts/validate_plan_workspace.py .demo-workspace-real-project
      - name: Validate checked-in case study
        run: python scripts/validate_plan_workspace.py examples/real-project/workspace
